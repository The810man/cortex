[project]
name = "cortex"
version = "0.1.0"
description = "A self-awakening, self-improving brain of agents with a terminal UI, running on local models"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1 ; sys_platform == 'win32'",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "opencv-python-headless>=4.10 ; sys_platform == 'win32'",
    "piper-tts>=1.8.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5 ; sys_platform == 'win32'",
    "textual>=8.2.8",
    "typer>=0.27.3",
    "uiautomation>=2.0.20 ; sys_platform == 'win32'",
]

[project.scripts]
cortex = "cortex.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
